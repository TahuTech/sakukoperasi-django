name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sakukoperasi

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sakukoperasi_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_NAME: sakukoperasi_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DJANGO_DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sakukoperasi/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Migrations up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test core --verbosity 2

      - name: Production settings check
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
        run: python manage.py check --deploy

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sakukoperasi-web:ci ./sakukoperasi
